<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Image de partage Lémanor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;600&amp;family=Playfair+Display:ital,wght@0,500;1,400&amp;display=block">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#1B2F5B;color:#FAF6EC;font-family:'Montserrat',Arial,sans-serif;display:flex;align-items:stretch;gap:72px;padding:72px 88px;box-sizing:border-box}
.texte{flex:1 1 0;display:flex;flex-direction:column;justify-content:space-between}
.eyebrow{font-size:16px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:#D4B676}
h1{margin:0;font-family:'Playfair Display',Georgia,serif;font-weight:500;font-size:132px;line-height:1;letter-spacing:-.01em}
.tag{margin:22px 0 0;font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:42px;color:#D4B676}
.pied{border-top:1px solid #3F5382;padding-top:22px;font-size:20px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;line-height:1.7}
.pied span{display:block;font-weight:300;letter-spacing:.04em;text-transform:none;font-size:22px;color:#D9DDE7}
.marque{width:300px;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<div class="texte">
  <div class="eyebrow">Genève · Toute la Suisse</div>
  <div>
    <h1>Lémanor</h1>
    <p class="tag">L'éclat du détail.</p>
  </div>
  <div class="pied">Nettoyage · Conciergerie · Entretien<span>Bureaux, immeubles, logements, remise en état, vitres</span></div>
</div>
<div class="marque">
  <svg width="300" height="360" viewBox="0 0 80 96" role="img" aria-label="Lémanor">
    <path d="M4 94V40a36 36 0 0 1 72 0v54z" fill="#0F1D3A"/>
    <path d="M11 94V40a29 29 0 0 1 58 0v54" fill="none" stroke="#B8924A" stroke-width="1.5"/>
    <text x="40" y="72" text-anchor="middle" font-family="'Playfair Display',Georgia,serif" font-size="46" font-weight="500" fill="#FAF6EC">L</text>
    <path d="M55 22c.5 4.5 1.5 5.5 6 6-4.5.5-5.5 1.5-6 6-.5-4.5-1.5-5.5-6-6 4.5-.5 5.5-1.5 6-6z" fill="#B8924A"/>
  </svg>
</div>
</body>
</html>
